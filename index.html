<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoodLove Image Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <audio id="drums-audio" src="cut_wallows_drums.mp3" preload="auto"></audio>
    <audio id="bass-audio" src="cut_wallows_bass.mp3" preload="auto"></audio>
    <div class="topbar">
      <div>
        <p class="eyebrow">GOODLOVE / IMAGE MAP</p>
      </div>
      <div class="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-label">Glow off</span>
      </div>
    </div>

    <section class="stage" id="stage" tabindex="0" aria-label="SF1 image map. Press W, P, E, R, Y, S, V, F, X, D, C, J, or K to toggle the glow windows.">
      <img class="map-image" id="map-image" src="SF1.jpg" alt="SF1 image">
      <img class="glow-image glow-image-one" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-two" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-three" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-four" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-five" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-six" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-seven" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-eight" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-nine" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-ten" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-eleven" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-twelve" src="SF1.jpg" alt="" aria-hidden="true">
      <img class="glow-image glow-image-thirteen" src="SF1.jpg" alt="" aria-hidden="true">
      <div class="glow-aura glow-aura-one" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-two" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-three" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-four" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-five" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-six" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-seven" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-eight" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-nine" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-ten" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-eleven" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-twelve" aria-hidden="true"></div>
      <div class="glow-aura glow-aura-thirteen" aria-hidden="true"></div>
      <div class="coordinates">W: BOX 1 / P: DRUMS / E: BOX 3 / R: BOX 4 / Y: BASS / S: BOX 6 / V: BOX 7 / F: BOX 8 / X: BOX 9 / D: BOX 10 / J: BOX 11 / C: DIAMOND / K: BOX 13</div>
    </section>

    <footer class="instructions">
      <span class="keycap">W</span>
      <span>box 1</span>
      <span class="keycap">P</span>
      <span>drums</span>
      <span class="keycap">E</span>
      <span>box 3</span>
      <span class="keycap">R</span>
      <span>box 4</span>
      <span class="keycap">Y</span>
      <span>bass</span>
      <span class="keycap">S</span>
      <span>box 6</span>
      <span class="keycap">V</span>
      <span>box 7</span>
      <span class="keycap">F</span>
      <span>box 8</span>
      <span class="keycap">X</span>
      <span>box 9</span>
      <span class="keycap">D</span>
      <span>box 10</span>
      <span class="keycap">J</span>
      <span>box 11</span>
      <span class="keycap">C</span>
      <span>diamond</span>
      <span class="keycap">K</span>
      <span>box 13</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
